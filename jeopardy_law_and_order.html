<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jeopardy! — Law &amp; Order</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0d1a;
  --board: #0f3460;
  --board-hover: #16497a;
  --board-done: #111128;
  --gold: #f5c518;
  --gold-dim: #b8921a;
  --white: #f0f0ff;
  --muted: #8888aa;
  --correct: #2ecc71;
  --wrong: #e74c3c;
  --accent: #e94560;
  --modal-bg: #0a0a1f;
}

html, body {
  background: var(--bg);
  color: var(--white);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  touch-action: manipulation;
}

button, div[role="button"] {
  touch-action: manipulation;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  border: none;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  -webkit-user-select: none;
  user-select: none;
}

/* ── SCREENS ── */
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; min-height: 100vh; }

/* ── SETUP ── */
#screen-setup {
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
}

.setup-box {
  width: 100%;
  max-width: 480px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(245,197,24,0.3);
  border-radius: 20px;
  padding: 2rem;
}

.logo {
  text-align: center;
  margin-bottom: 1.75rem;
}
.logo-j {
  display: inline-block;
  font-size: 52px;
  font-weight: 900;
  color: var(--gold);
  letter-spacing: -2px;
  text-shadow: 0 0 40px rgba(245,197,24,0.5);
  line-height: 1;
}
.logo-sub {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 4px;
}

.setup-label {
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.num-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 1.5rem;
}
.num-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: rgba(245,197,24,0.12);
  border: 1px solid rgba(245,197,24,0.35) !important;
  color: var(--gold);
  font-size: 22px;
  display: flex; align-items: center; justify-content: center;
}
.num-btn:active { background: rgba(245,197,24,0.3); }
.num-val {
  font-size: 24px;
  font-weight: 700;
  color: var(--white);
  min-width: 30px;
  text-align: center;
}

.team-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 1.75rem;
}
.team-wrap label {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.team-wrap input {
  width: 100%;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  color: var(--white);
  font-size: 14px;
  -webkit-appearance: none;
}
.team-wrap input:focus {
  outline: none;
  border-color: var(--gold);
}

.play-btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--gold), #e0a800);
  color: #0a0a1f;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.play-btn:active { filter: brightness(0.9); }

/* ── GAME BOARD ── */
#screen-game {
  padding: 0.75rem;
  gap: 10px;
}

.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.game-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 2px;
}

.scores-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.score-pill {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  color: var(--muted);
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.score-pill.active-team {
  background: rgba(245,197,24,0.2);
  border-color: var(--gold);
  color: var(--gold);
}

/* board */
.board {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  flex: 1;
}

.cat-header {
  background: var(--gold);
  color: #0a0a1f;
  border-radius: 8px;
  padding: 8px 4px;
  text-align: center;
  font-size: clamp(9px, 1.5vw, 13px);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  line-height: 1.2;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 52px;
}

.cell {
  background: var(--board);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 54px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, transform 0.1s;
  perspective: 600px;
  position: relative;
  overflow: hidden;
}
.cell:active:not(.done) { transform: scale(0.95); }
.cell.done {
  background: var(--board-done);
  cursor: default;
}

.cell-inner {
  font-size: clamp(14px, 2.5vw, 22px);
  font-weight: 800;
  color: var(--gold);
  text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  transition: opacity 0.2s;
  pointer-events: none;
}
.cell.done .cell-inner { opacity: 0; }

/* turn indicator */
.turn-bar {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  padding: 2px 0;
}
.turn-bar span {
  color: var(--gold);
  font-weight: 700;
}

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--modal-bg);
  border: 1px solid rgba(245,197,24,0.35);
  border-radius: 20px;
  padding: 2rem 1.5rem;
  max-width: 620px;
  width: 100%;
  text-align: center;
}

.modal-cat {
  font-size: 11px;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 6px;
}
.modal-pts {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 1.25rem;
}

.modal-q {
  font-size: clamp(16px, 3vw, 22px);
  font-weight: 600;
  line-height: 1.5;
  color: var(--white);
  margin-bottom: 1.75rem;
  min-height: 60px;
}

/* answer reveal phase */
.answer-area {
  display: none;
  margin-bottom: 1.5rem;
}
.answer-area.show { display: block; }
.answer-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.answer-text {
  font-size: clamp(15px, 2.5vw, 20px);
  font-weight: 700;
  color: var(--correct);
  padding: 12px 20px;
  background: rgba(46,204,113,0.1);
  border: 1px solid rgba(46,204,113,0.3);
  border-radius: 12px;
  display: inline-block;
}

.modal-btn-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.modal-btn {
  padding: 11px 22px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.modal-btn.primary {
  background: linear-gradient(135deg, var(--gold), #e0a800);
  color: #0a0a1f;
}
.modal-btn.correct-btn {
  background: rgba(46,204,113,0.15);
  border: 1px solid var(--correct);
  color: var(--correct);
}
.modal-btn.wrong-btn {
  background: rgba(231,76,60,0.15);
  border: 1px solid var(--wrong);
  color: var(--wrong);
}
.modal-btn.neutral {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--muted);
}
.modal-btn:active { filter: brightness(0.85); }

/* team selector in modal */
.team-select-label {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.team-select-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 1.25rem;
}
.team-sel-btn {
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--muted);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.team-sel-btn.selected {
  background: rgba(245,197,24,0.2);
  border-color: var(--gold);
  color: var(--gold);
}
.team-sel-btn:active { filter: brightness(0.85); }

/* ── FINAL ── */
#screen-final {
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
}
.final-box {
  width: 100%;
  max-width: 440px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(245,197,24,0.3);
  border-radius: 20px;
  padding: 2rem;
  text-align: center;
}
.final-trophy { font-size: 52px; margin-bottom: 0.5rem; }
.final-title {
  font-size: 26px;
  font-weight: 900;
  color: var(--gold);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.final-sub { font-size: 13px; color: var(--muted); margin-bottom: 1.5rem; }

.podium-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: 15px;
}
.podium-row.p1 { background: rgba(245,197,24,0.18); border: 1px solid rgba(245,197,24,0.4); color: var(--gold); font-weight: 700; }
.podium-row.p2 { background: rgba(200,200,220,0.08); border: 1px solid rgba(255,255,255,0.12); color: #ccd; }
.podium-row.p3 { background: rgba(180,120,60,0.1); border: 1px solid rgba(180,120,60,0.25); color: #c9956a; }
.podium-row.px { background: rgba(255,255,255,0.03); color: var(--muted); font-size: 13px; }

.again-btn {
  margin-top: 1.5rem;
  padding: 12px 32px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--gold), #e0a800);
  color: #0a0a1f;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.again-btn:active { filter: brightness(0.9); }
</style>
</head>
<body>

<!-- SETUP -->
<div id="screen-setup" class="screen active">
  <div class="setup-box">
    <div class="logo">
      <div class="logo-j">JEOPARDY!</div>
      <div class="logo-sub">Law &amp; Order Edition</div>
    </div>
    <div class="setup-label">Number of teams</div>
    <div class="num-row">
      <div role="button" class="num-btn" id="btn-minus">−</div>
      <span class="num-val" id="num-val">4</span>
      <div role="button" class="num-btn" id="btn-plus">+</div>
    </div>
    <div class="setup-label">Team names</div>
    <div class="team-grid" id="team-inputs"></div>
    <div role="button" class="play-btn" id="play-btn">Let's Play!</div>
  </div>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">
  <div class="game-header">
    <div class="game-title">Jeopardy! — Law &amp; Order</div>
    <div class="scores-bar" id="scores-bar"></div>
  </div>
  <div class="turn-bar">Turn: <span id="turn-name">Team 1</span></div>
  <div class="board" id="board"></div>
</div>

<!-- FINAL -->
<div id="screen-final" class="screen">
  <div class="final-box">
    <div class="final-trophy">🏆</div>
    <div class="final-title">Game Over!</div>
    <div class="final-sub">Final scores</div>
    <div id="final-podium"></div>
    <div role="button" class="again-btn" id="again-btn">Play Again</div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-cat" id="modal-cat"></div>
    <div class="modal-pts" id="modal-pts"></div>
    <div class="modal-q" id="modal-q"></div>
    <div class="answer-area" id="answer-area">
      <div class="answer-label">Answer</div>
      <div class="answer-text" id="answer-text"></div>
    </div>
    <div id="modal-team-select" style="display:none">
      <div class="team-select-label">Which team answered?</div>
      <div class="team-select-row" id="team-sel-row"></div>
    </div>
    <div class="modal-btn-row" id="modal-btn-row"></div>
  </div>
</div>

<!-- QUESTION DATA -->

<!-- GAME LOGIC -->
<script>
(function() {

  /* ── DATA ── */
  const DATA = JSON.parse(document.getElementById('q-data').textContent);
  const CATS = DATA.categories;
  const MEDALS = ['1st','2nd','3rd','4th','5th','6th','7th','8th'];

  /* ── STATE ── */
  let numTeams = 4;
  let teams = [];
  let scores = [];
  let currentTeam = 0;
  let cellsDone = {};
  let activeCell = null; // {ci, qi}
  let modalPhase = 'question'; // 'question' | 'scoring'
  let selectedScoringTeam = null;

  /* ── UTILS ── */
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s) {
      s.classList.remove('active');
    });
    document.getElementById('screen-' + id).classList.add('active');
  }

  function on(id, evt, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener(evt, fn);
  }

  function tap(id, fn) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('touchend', function(e) { e.preventDefault(); fn(e); });
    el.addEventListener('click', fn);
  }

  /* ── SETUP ── */
  function renderTeamInputs() {
    var grid = document.getElementById('team-inputs');
    var existing = [];
    grid.querySelectorAll('input').forEach(function(inp) { existing.push(inp.value); });
    grid.innerHTML = '';
    for (var i = 0; i < numTeams; i++) {
      var wrap = document.createElement('div');
      wrap.className = 'team-wrap';
      wrap.innerHTML = '<label>Team ' + (i+1) + '</label><input id="ti-' + i + '" placeholder="Team ' + (i+1) + '" value="">';
      grid.appendChild(wrap);
      if (existing[i] !== undefined) document.getElementById('ti-' + i).value = existing[i];
    }
  }

  on('btn-minus', 'touchend', function(e) { e.preventDefault(); changeTeams(-1); });
  on('btn-minus', 'click', function() { changeTeams(-1); });
  on('btn-plus', 'touchend', function(e) { e.preventDefault(); changeTeams(1); });
  on('btn-plus', 'click', function() { changeTeams(1); });

  function changeTeams(d) {
    numTeams = Math.max(2, Math.min(8, numTeams + d));
    document.getElementById('num-val').textContent = numTeams;
    renderTeamInputs();
  }

  on('play-btn', 'touchend', function(e) { e.preventDefault(); startGame(); });
  on('play-btn', 'click', startGame);

  function startGame() {
    teams = [];
    for (var i = 0; i < numTeams; i++) {
      var inp = document.getElementById('ti-' + i);
      teams.push((inp && inp.value.trim()) || ('Team ' + (i+1)));
    }
    scores = new Array(numTeams).fill(0);
    currentTeam = 0;
    cellsDone = {};
    showScreen('game');
    renderBoard();
    renderScores();
    renderTurn();
  }

  /* ── BOARD ── */
  function renderBoard() {
    var board = document.getElementById('board');
    board.innerHTML = '';

    // Headers
    CATS.forEach(function(cat) {
      var h = document.createElement('div');
      h.className = 'cat-header';
      h.textContent = cat.name;
      board.appendChild(h);
    });

    // Cells
    var numRows = CATS[0].questions.length;
    for (var qi = 0; qi < numRows; qi++) {
      for (var ci = 0; ci < CATS.length; ci++) {
        (function(ci, qi) {
          var cell = document.createElement('div');
          var key = ci + '-' + qi;
          cell.className = 'cell' + (cellsDone[key] ? ' done' : '');
          cell.id = 'cell-' + key;
          var inner = document.createElement('div');
          inner.className = 'cell-inner';
          inner.textContent = '$' + CATS[ci].questions[qi].pts;
          cell.appendChild(inner);
          if (!cellsDone[key]) {
            cell.addEventListener('touchend', function(e) { e.preventDefault(); openQuestion(ci, qi); });
            cell.addEventListener('click', function() { openQuestion(ci, qi); });
          }
          board.appendChild(cell);
        })(ci, qi);
      }
    }
  }

  function renderScores() {
    var bar = document.getElementById('scores-bar');
    bar.innerHTML = '';
    teams.forEach(function(t, i) {
      var pill = document.createElement('div');
      pill.className = 'score-pill' + (i === currentTeam ? ' active-team' : '');
      pill.id = 'score-pill-' + i;
      pill.textContent = t + ': $' + scores[i].toLocaleString();
      bar.appendChild(pill);
    });
  }

  function renderTurn() {
    document.getElementById('turn-name').textContent = teams[currentTeam];
  }

  /* ── MODAL ── */
  function openQuestion(ci, qi) {
    var key = ci + '-' + qi;
    if (cellsDone[key]) return;
    activeCell = { ci: ci, qi: qi };
    modalPhase = 'question';
    selectedScoringTeam = currentTeam;

    var q = CATS[ci].questions[qi];
    document.getElementById('modal-cat').textContent = CATS[ci].name;
    document.getElementById('modal-pts').textContent = '$' + q.pts;
    document.getElementById('modal-q').textContent = q.q;
    document.getElementById('answer-area').classList.remove('show');
    document.getElementById('answer-text').textContent = q.a;
    document.getElementById('modal-team-select').style.display = 'none';

    renderModalBtns();
    document.getElementById('modal').classList.add('open');
  }

  function renderModalBtns() {
    var row = document.getElementById('modal-btn-row');
    row.innerHTML = '';

    if (modalPhase === 'question') {
      var revealBtn = document.createElement('button');
      revealBtn.className = 'modal-btn primary';
      revealBtn.textContent = 'Reveal Answer';
      revealBtn.addEventListener('touchend', function(e) { e.preventDefault(); revealAnswer(); });
      revealBtn.addEventListener('click', revealAnswer);
      row.appendChild(revealBtn);

      var skipBtn = document.createElement('button');
      skipBtn.className = 'modal-btn neutral';
      skipBtn.textContent = 'Skip';
      skipBtn.addEventListener('touchend', function(e) { e.preventDefault(); closeModal(false); });
      skipBtn.addEventListener('click', function() { closeModal(false); });
      row.appendChild(skipBtn);

    } else {
      // Scoring phase
      renderTeamSelectForScoring();

      var correctBtn = document.createElement('button');
      correctBtn.className = 'modal-btn correct-btn';
      correctBtn.textContent = 'Correct +$' + CATS[activeCell.ci].questions[activeCell.qi].pts;
      correctBtn.addEventListener('touchend', function(e) { e.preventDefault(); scoreAnswer(true); });
      correctBtn.addEventListener('click', function() { scoreAnswer(true); });
      row.appendChild(correctBtn);

      var wrongBtn = document.createElement('button');
      wrongBtn.className = 'modal-btn wrong-btn';
      wrongBtn.textContent = 'Wrong / No Answer';
      wrongBtn.addEventListener('touchend', function(e) { e.preventDefault(); scoreAnswer(false); });
      wrongBtn.addEventListener('click', function() { scoreAnswer(false); });
      row.appendChild(wrongBtn);
    }
  }

  function renderTeamSelectForScoring() {
    var sel = document.getElementById('modal-team-select');
    sel.style.display = 'block';
    var row = document.getElementById('team-sel-row');
    row.innerHTML = '';
    teams.forEach(function(t, i) {
      var btn = document.createElement('button');
      btn.className = 'team-sel-btn' + (i === selectedScoringTeam ? ' selected' : '');
      btn.textContent = t;
      btn.addEventListener('touchend', function(e) { e.preventDefault(); selectedScoringTeam = i; renderTeamSelectForScoring(); });
      btn.addEventListener('click', function() { selectedScoringTeam = i; renderTeamSelectForScoring(); });
      row.appendChild(btn);
    });
  }

  function revealAnswer() {
    modalPhase = 'scoring';
    document.getElementById('answer-area').classList.add('show');
    renderModalBtns();
  }

  function scoreAnswer(correct) {
    if (correct && activeCell) {
      var pts = CATS[activeCell.ci].questions[activeCell.qi].pts;
      scores[selectedScoringTeam] += pts;
    }
    closeModal(true);
  }

  function closeModal(advance) {
    if (activeCell) {
      var key = activeCell.ci + '-' + activeCell.qi;
      cellsDone[key] = true;
      var cell = document.getElementById('cell-' + key);
      if (cell) cell.className = 'cell done';
    }
    document.getElementById('modal').classList.remove('open');
    activeCell = null;

    if (advance) {
      currentTeam = (currentTeam + 1) % numTeams;
    }

    renderScores();
    renderTurn();

    if (checkGameOver()) {
      setTimeout(showFinal, 300);
    }
  }

  function checkGameOver() {
    var total = CATS.length * CATS[0].questions.length;
    return Object.keys(cellsDone).length >= total;
  }

  /* ── FINAL ── */
  function showFinal() {
    showScreen('final');
    var sorted = teams.map(function(t, i) { return { t: t, s: scores[i] }; });
    sorted.sort(function(a, b) { return b.s - a.s; });
    var medals = ['🥇','🥈','🥉'];
    var cls = ['p1','p2','p3'];
    document.getElementById('final-podium').innerHTML = sorted.map(function(item, i) {
      return '<div class="podium-row ' + (cls[i] || 'px') + '"><span>' + (medals[i] || '  ') + ' ' + item.t + '</span><span>$' + item.s.toLocaleString() + '</span></div>';
    }).join('');
  }

  on('again-btn', 'touchend', function(e) { e.preventDefault(); resetGame(); });
  on('again-btn', 'click', resetGame);

  function resetGame() {
    numTeams = 4;
    teams = [];
    scores = [];
    currentTeam = 0;
    cellsDone = {};
    activeCell = null;
    document.getElementById('num-val').textContent = numTeams;
    renderTeamInputs();
    showScreen('setup');
  }

  /* ── INIT ── */
  renderTeamInputs();

})();
</script>
</body>
</html>
