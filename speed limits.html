const LADDER = [
  100,   // Q1
  100,   // Q2
  200,   // Q3
  200,   // Q4
  200,   // Q5
  300,   // Q6
  300,   // Q7
  400,   // Q8
  400,   // Q9
  400,   // Q10
  500,   // Q11
  500,   // Q12
  600,   // Q13
  600,   // Q14
  600,   // Q15
  700,   // Q16
  700,   // Q17
  800,   // Q18
  800,   // Q19
  800,   // Q20
  900,   // Q21
  900,   // Q22
  1000,  // Q23
  1000,  // Q24
  1000   // Q25
];
const LETTERS=['A','B','C','D'];

let numTeams=4, teams=[], scores=[], lifelines=[];
let qIndex=0,
    currentTeam=0,
    questions=[],
    eliminated=[],
    gamePhase='pick';

let timerInterval=null;
let timeRemaining=20;

function changeTeams(d){
  numTeams=Math.max(2,Math.min(8,numTeams+d));
  document.getElementById('num-val').textContent=numTeams;
  renderTeamInputs();
}

function renderTeamInputs(){
  const c=document.getElementById('team-inputs');
  c.innerHTML='';
  for(let i=0;i<numTeams;i++){
    const w=document.createElement('div');
    w.className='team-wrap';
    w.innerHTML=`<label>Team ${i+1}</label><input id="ti-${i}" placeholder="Team ${i+1} name" value="${teams[i]||''}">`;
    c.appendChild(w);
  }
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function startTimer(){

  clearInterval(timerInterval);

  timeRemaining = 20;

  const timerEl = document.getElementById('timer');

  if(timerEl){
    timerEl.textContent = timeRemaining;
    timerEl.parentElement.classList.remove('timer-warning');
  }

  timerInterval = setInterval(()=>{

    timeRemaining--;

    if(timerEl){
      timerEl.textContent = timeRemaining;
    }

if(timeRemaining <= 5 && timerEl){
  document.getElementById('timer-box').classList.add('timer-warning');
}

    if(timeRemaining <= 0){

      clearInterval(timerInterval);

      timeUp();
    }

  },1000);
}

function stopTimer(){
  clearInterval(timerInterval);
}

function timeUp(){

  const q = questions[qIndex];

  gamePhase='revealed';

  document.querySelectorAll('.opt-btn').forEach((b,bi)=>{

    b.disabled=true;

    if(bi===q.answer){
      b.classList.add('correct');
    }

  });

  showResult(false,q);

  document.getElementById('info-area').innerHTML=
    '<div class="info-msg"><strong>Time is up!</strong></div>';

  renderLadder();
}

function buildQuestionSet() {

  const result = [];

  for (let level = 1; level <= 10; level++) {

    const levelQuestions =
      shuffle(
        ALL_QUESTIONS.filter(q => q.level === level)
      );

    result.push(...levelQuestions.slice(0, 2));
  }

  const extraLevels = [2,4,6,8,10];

  extraLevels.forEach(level => {

    const remaining =
      shuffle(
        ALL_QUESTIONS.filter(
          q =>
            q.level === level &&
            !result.includes(q)
        )
      );

    if (remaining.length > 0) {
    result.push(remaining[0]);
}
  });

  return result.sort((a,b)=>a.level-b.level);
}

function startGame(){
  teams=[];
  for(let i=0;i<numTeams;i++){
    const el = document.getElementById(`ti-${i}`);
    const v = el ? el.value.trim() : '';
    teams.push(v||`Team ${i+1}`);
  }
  scores=new Array(numTeams).fill(0);
  lifelines=teams.map(()=>({fifty:false,ask:false,friend:false}));
  questions = buildQuestionSet();
  qIndex=0; currentTeam=0;
  showScreen('game');
  renderGame();
}

function showScreen(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+n).classList.add('active');
}

function renderGame(){
  renderPills(); renderQuestion(); renderScoreboard(); renderLadder(); renderLifelines();
  document.getElementById('result-area').innerHTML='';
  document.getElementById('info-area').innerHTML='';
  document.getElementById('vote-area').innerHTML='';
  gamePhase='pick'; eliminated=[];
  startTimer();
}

function renderPills(){
  const c=document.getElementById('team-pills');
  c.innerHTML='';
  teams.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='t-pill'+(i===currentTeam?' active':'');
    b.textContent=t;
    b.onclick=null;
    c.appendChild(b);
  });
}

function renderQuestion(){

  if(qIndex >= questions.length){
    showFinal();
    return;
  }

  document.getElementById('timer').textContent = '20';
  document.getElementById('timer-box').classList.remove('timer-warning');

  const q=questions[qIndex];

  document.getElementById('q-num').textContent=
    `Question ${qIndex+1} of ${questions.length}`;
  document.getElementById('q-topic').textContent=q.topic;
  document.getElementById('q-pts').textContent =
`${q.level * 100} pts`;
  document.getElementById('q-text').textContent=q.text;
  const og=document.getElementById('opts-grid');
  og.innerHTML='';
  q.options.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='opt-btn'; b.id=`opt-${i}`;
    b.innerHTML=`<span class="opt-letter">${LETTERS[i]}</span>${opt}`;
    b.onclick=()=>selectAnswer(i);
    og.appendChild(b);
  });
}

function selectAnswer(i){
  stopTimer();
  if(gamePhase!=='pick'||eliminated.includes(i)) return;
  const q=questions[qIndex];
  gamePhase='revealed';
  document.querySelectorAll('.opt-btn').forEach((b,bi)=>{
    b.disabled=true;
    if(bi===q.answer) b.classList.add('correct');
    else if(bi===i&&i!==q.answer) b.classList.add('wrong');
  });
  if(i===q.answer){
      scores[currentTeam] += q.level * 100;
  } 
  document.getElementById('vote-area').innerHTML='';
  document.getElementById('info-area').innerHTML='';
  showResult(i===q.answer,q);
  renderScoreboard(); renderLadder();
}

function showResult(correct,q){

  const ra=document.getElementById('result-area');
  const nextTeam=(currentTeam+1)%numTeams;
  const isLast=qIndex>=questions.length-1;

  const awardedPoints = q.level * 100;

  ra.innerHTML=`<div class="result-box">
    <div class="result-icon">${correct ? '✅' : '❌'}</div>
    <div class="result-title">${correct ? 'Correct!' : 'Wrong answer!'}</div>

    <div class="result-sub">
      ${
        correct
          ? `+${awardedPoints} points for ${teams[currentTeam]}`
          : `The correct answer was ${LETTERS[q.answer]}: ${q.options[q.answer]}`
      }
    </div>

    ${
      isLast
        ? `<button class="res-btn" onclick="showFinal()">See final scores</button>`
        : `<button class="res-btn" onclick="nextQ()">Next question → ${teams[nextTeam]}'s turn</button>`
    }
  </div>`;
}

function nextQ(){

  qIndex++;

  if(qIndex >= questions.length){
    showFinal();
    return;
  }

  currentTeam=(currentTeam+1)%numTeams;

  renderGame();
}

function renderScoreboard(){
  const sorted=teams.map((t,i)=>({t,s:scores[i],i})).sort((a,b)=>b.s-a.s);
  document.getElementById('scoreboard').innerHTML=sorted.map(({t,s,i})=>
    `<div class="score-row${i===currentTeam?' cur':''}"><span>${t}</span><span class="score-pts">${s.toLocaleString()}</span></div>`
  ).join('');
}

function renderLadder(){
  document.getElementById('ladder').innerHTML=[...LADDER].reverse().map((v,ri)=>{
    const step=LADDER.length-1-ri;
    const cls=step===qIndex?'lad-row cur':step<qIndex?'lad-row done':'lad-row';
    return `<div class="${cls}">
<span>Q${step+1}</span>
<span>${v} pts</span>
</div>`;
  }).join('');
}

function renderLifelines(){
  const ll=lifelines[currentTeam];
  [['5050',ll.fifty],['ask',ll.ask],['friend',ll.friend]].forEach(([id,used])=>{
    const el=document.getElementById('ll-'+id);
    el.disabled=used; el.className='ll-btn'+(used?' used':'');
  });
}

function use5050(){
  if(gamePhase!=='pick') return;
  lifelines[currentTeam].fifty=true; renderLifelines();
  const q=questions[qIndex];
  const wrong = shuffle(
  [0,1,2,3].filter(
    i => i !== q.answer && !eliminated.includes(i)
  )
).slice(0,2);
  wrong.forEach(i=>{
    eliminated.push(i);
    const b=document.getElementById(`opt-${i}`);
    if(b) b.classList.add('eliminated');
  });
  document.getElementById('info-area').innerHTML=`<div class="info-msg">50/50 used — two wrong answers removed.</div>`;
}

function useAskClass(){
  if(gamePhase!=='pick') return;

  lifelines[currentTeam].ask=true;
  renderLifelines();

  stopTimer();

  document.getElementById('info-area').innerHTML=`
    <div class="info-msg">
      <strong>Ask the Class</strong><br>
      Consult the other teams for advice.<br>
      You have 30 seconds to discuss and collect opinions.
    </div>
  `;
}

function usePhoneFriend(){
  if(gamePhase!=='pick') return;

  lifelines[currentTeam].friend=true;
  renderLifelines();

  document.getElementById('info-area').innerHTML=`
    <div class="info-msg">
      <strong>Phone the Teacher</strong><br>
      Ask the teacher for a clue or guidance.
    </div>
  `;
}

function showFinal(){
  stopTimer();
  showScreen('final');
  const sorted=teams.map((t,i)=>({t,s:scores[i]})).sort((a,b)=>b.s-a.s);
  const medals=['🥇','🥈','🥉'];
  const cls=['p1','p2','p3'];
  document.getElementById('final-podium').innerHTML=sorted.map((item,i)=>
    `<div class="podium-row ${cls[i]||'px'}"><span>${medals[i]||'  '} ${item.t}</span><span>${item.s.toLocaleString()} pts</span></div>`
  ).join('');
}

function restartGame(){

  stopTimer();

  qIndex = 0;
  currentTeam = 0;
  questions = [];
  scores = [];
  lifelines = [];
  eliminated = [];

  showScreen('setup');
  renderTeamInputs();
}

renderTeamInputs();
</script>
