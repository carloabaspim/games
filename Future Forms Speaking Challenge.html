<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Future Forms Speaking Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e6;--ink:#1f2a44;--card:#ffffff;--will:#2b7de9;--going:#16a34a;--pc:#e8590c;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);text-align:center}
h1{margin:0 0 12px;font-size:clamp(20px,3.2vw,32px)}
.card{background:var(--card);border-radius:28px;box-shadow:0 8px 0 #e6d3a8;padding:28px 24px;width:min(900px,100%);min-height:200px;display:flex;align-items:center;justify-content:center}
#scenario{font-size:clamp(24px,4.6vw,48px);font-weight:600;line-height:1.25;margin:0}
#form{margin-top:22px;border-radius:24px;padding:16px 28px;color:#fff;width:min(900px,100%);min-height:110px;display:flex;flex-direction:column;justify-content:center;background:#9aa3b5}
#form .name{font-size:clamp(28px,5.5vw,56px);font-weight:700;margin:0}
#form .frame{font-size:clamp(18px,3vw,30px);margin:4px 0 0;opacity:.95}
#form .use{font-size:clamp(14px,2vw,20px);margin:6px 0 0;opacity:.9}
button{font-family:inherit;font-size:clamp(22px,3.5vw,34px);font-weight:700;margin-top:26px;padding:16px 48px;border:0;border-radius:999px;background:#ff3d71;color:#fff;box-shadow:0 7px 0 #b3204a;cursor:pointer}
button:active{transform:translateY(5px);box-shadow:0 2px 0 #b3204a}
#count{margin-top:14px;font-size:16px;opacity:.7}
</style>
</head>
<body>
<h1>🗣️ Future Forms Speaking Challenge</h1>
<div class="card"><p id="scenario">Press the button to start!</p></div>
<div id="form"><p class="name">?</p></div>
<button id="go">🎲 Spin!</button>
<div id="count"></div>

<script>
var FORMS={
will:{n:"WILL",f:"I will \u2026",u:"offers, instant decisions, predictions",c:"var(--will)"},
going:{n:"BE GOING TO",f:"I'm going to \u2026",u:"plans and intentions, or evidence now",c:"var(--going)"},
pc:{n:"PRESENT CONTINUOUS",f:"I'm \u2026ing \u2026",u:"fixed arrangements",c:"var(--pc)"}
};
var POOLS={
will:[
"Your friend forgot their lunch. Make an offer.",
"Your mum needs help in the kitchen and you are on your phone. What do you say?",
"The lights go out at home. What do you decide to do?",
"Your friend is carrying a very heavy bag. Offer to help.",
"You are at the canteen and you can't choose. Decide what to eat.",
"Your friend is sick today. Offer to help.",
"Your friend is nervous about a speaking test. Make a promise to support them.",
"Predict: what will life be like in the year 2050?",
"Predict: how will robots change schools in the future?",
"Predict: what jobs will be popular in 20 years?",
"Predict: who will win the next World Cup?",
"Your friend can't find their pen. Make an offer.",
"The classroom is very dirty. Offer to help the teacher.",
"Predict: what will our classroom look like in 20 years?",
"It is very hot in class. Make a decision or an offer.",
"Your friend is worried about a test. Predict how it will go and reassure them.",
"Predict your own future: will you be famous one day?"
],
going:[
"Look at the dark clouds in the sky. What is going to happen?",
"A boy is running with a full cup of juice. What is going to happen?",
"Your friend is carrying five plates and not looking. What is going to happen?",
"Talk about your plan for the next school vacation.",
"You want to get better at English. What is your plan?",
"You want to be healthy. What are your plans?",
"You want to save money. Talk about your plan.",
"Talk about what you want to do after you finish school.",
"Describe your dream job. How do you plan to get it?",
"You want to learn a new sport. Talk about your plan.",
"You have a big exam next week. Talk about your study plan.",
"Your class wants to help the environment. What is your plan?",
"A football player runs towards an open goal. What is going to happen?",
"The teacher walks in with a pile of papers and a serious face. What is going to happen?",
"You want to start a new hobby. Talk about your plan.",
"You want to buy something with your pocket money. What is your plan?",
"Talk about your plan for your next birthday."
],
pc:[
"Your friend asks: What are you doing this weekend? Answer.",
"You have a movie date with friends on Saturday. Give the arrangements (who, when, where).",
"You have a dentist appointment tomorrow. Talk about it.",
"Your class has a school trip next month. Talk about the arrangements.",
"You have concert tickets for next Saturday. Talk about it.",
"There is a family dinner on Sunday. Talk about the arrangements.",
"Your team has a sports day match next month. Talk about the arrangements.",
"You are visiting your grandparents next week. Talk about the arrangements.",
"Songkran is coming. Talk about your arrangements.",
"Your friend asks: What are you doing after school today? Answer.",
"You are having a picnic with classmates on Sunday. Talk about the arrangements.",
"You are having a birthday party next Friday. Who is coming and where?",
"Your holiday is booked! Talk about your flights, hotel and dates.",
"You have a group project meeting on Thursday. Talk about the arrangements.",
"You are playing football with friends next Sunday. Talk about it.",
"You have an English lesson with a new teacher tomorrow. Talk about it."
]};
var deck=[],last=null,total=0;
(function(){for(var k in POOLS){total+=POOLS[k].length}})();
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function newDeck(){
  var d=[];
  for(var k in POOLS){POOLS[k].forEach(function(s){d.push({k:k,s:s})})}
  shuffle(d);
  if(last&&d[d.length-1].k===last&&d.length>1){d.unshift(d.pop())}
  return d;
}
function spin(){
  if(!deck.length){deck=newDeck()}
  var item=deck.pop();last=item.k;
  document.getElementById('scenario').textContent=item.s;
  var f=FORMS[item.k];
  var box=document.getElementById('form');
  box.style.background=f.c;
  box.innerHTML='<p class="name">'+f.n+'</p><p class="frame">'+f.f+'</p><p class="use">('+f.u+')</p>';
  document.getElementById('count').textContent=(total-deck.length)+' / '+total+' used';
}
document.getElementById('go').addEventListener('click',spin);
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='Enter'){e.preventDefault();spin()}});
</script>
</body>
</html>
